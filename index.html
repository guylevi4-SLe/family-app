<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fdf7fa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="לוי'ס" />
    <link rel="icon" href="/favicon-pink-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-pink.png" />
    <title>לוי'ס</title>
    <script>
      try { document.documentElement.dataset.palette = localStorage.getItem('palette') || 'pink'; } catch (e) { document.documentElement.dataset.palette = 'pink'; }
    </script>
  </head>
  <body>
    <!-- The logo shows from the first paint, before the app's code runs; the app keeps it until the first screen is ready. Same drawing as BrandLogo. -->
    <div id="root">
      <div class="splash" aria-busy="true">
        <svg class="splash-logo" width="96" height="96" viewBox="0 0 192 192" aria-hidden="true">
          <rect class="logo-bg" width="192" height="192" rx="42" />
          <path class="logo-bubble" d="M96 30 L168 62 V138 H72 L50 162 V138 H24 V62 Z" stroke-linejoin="round" />
          <text class="logo-text" x="96" y="117" text-anchor="middle" direction="ltr" unicode-bidi="bidi-override" font-size="50" font-weight="800" font-family="Heebo, Arial, sans-serif">ס'יול</text>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
